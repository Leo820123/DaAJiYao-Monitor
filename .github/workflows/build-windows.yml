name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitor.py'
      - 'gui.py'
      - 'test_monitor.py'
      - '.github/workflows/build-windows.yml'
      - 'requirements.txt'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller
      - name: Check Python syntax
        run: python -m py_compile monitor.py gui.py
      - name: Run offline history tests
        run: python -m unittest -v test_monitor.py
      - name: Package EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DaAJiYaoMonitor --collect-all playwright gui.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: DaAJiYaoMonitor-Windows
          path: dist/DaAJiYaoMonitor.exe
          if-no-files-found: error
